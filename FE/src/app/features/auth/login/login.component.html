<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-500 to-purple-600 p-5">
  <div class="bg-white rounded-lg shadow-2xl p-10 w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Entrar</h2>
    <p class="text-center text-gray-600 text-sm mb-8">Entre na sua conta para continuar</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-5">
        <label for="email" class="block mb-2 text-sm font-medium text-gray-700">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
          [class.border-red-500]="email?.invalid && email?.touched"
          placeholder="seu@email.com">
        <div *ngIf="email?.invalid && email?.touched" class="text-red-500 text-xs mt-1">
          <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="email?.errors?.['email']">Email inválido</span>
        </div>
      </div>

      <div class="mb-5">
        <label for="password" class="block mb-2 text-sm font-medium text-gray-700">Senha</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
          [class.border-red-500]="password?.invalid && password?.touched"
          placeholder="••••••••">
        <div *ngIf="password?.invalid && password?.touched" class="text-red-500 text-xs mt-1">
          <span *ngIf="password?.errors?.['required']">Senha é obrigatória</span>
          <span *ngIf="password?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full bg-primary-500 hover:bg-primary-600 text-white font-medium py-3 rounded-lg transition-colors disabled:opacity-60 disabled:cursor-not-allowed mt-2"
        [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="mt-6 text-center">
      <p class="text-gray-600 text-sm">
        Não tem uma conta? 
        <a routerLink="/auth/register" class="text-primary-500 font-medium hover:underline">Cadastre-se</a>
      </p>
    </div>
  </div>
</div>
