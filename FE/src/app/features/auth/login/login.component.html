<div class="login-container">
    <div class="login-card">
        <h2>Entrar</h2>
        <p class="subtitle">Entre na sua conta para continuar</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" formControlName="email" class="form-control"
                    [class.invalid]="email?.invalid && email?.touched" placeholder="seu@email.com">
                <div *ngIf="email?.invalid && email?.touched" class="error-message">
                    <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
                    <span *ngIf="email?.errors?.['email']">Email inválido</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" formControlName="password" class="form-control"
                    [class.invalid]="password?.invalid && password?.touched" placeholder="••••••••">
                <div *ngIf="password?.invalid && password?.touched" class="error-message">
                    <span *ngIf="password?.errors?.['required']">Senha é obrigatória</span>
                    <span *ngIf="password?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
                </div>
            </div>

            <button type="submit" class="btn-primary" [disabled]="loading">
                {{ loading ? 'Entrando...' : 'Entrar' }}
            </button>
        </form>

        <div class="footer">
            <p>Não tem uma conta? <a routerLink="/auth/register">Cadastre-se</a></p>
        </div>
    </div>
</div>
