<div class="flex align-items-center justify-content-center"
    style="min-height: 100vh; background: linear-gradient(135deg, var(--primary-color) 0%, #6366f1 100%);">
    <p-card styleClass="login-card shadow-4">
        <ng-template pTemplate="header">
            <div class="text-center pt-4">
                <i class="pi pi-sign-in text-6xl" style="color: var(--primary-color);"></i>
            </div>
        </ng-template>

        <ng-template pTemplate="title">
            <h2 class="text-center m-0">Entrar</h2>
        </ng-template>

        <ng-template pTemplate="subtitle">
            <p class="text-center text-color-secondary m-0">Entre na sua conta para continuar</p>
        </ng-template>

        <ng-template pTemplate="content">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">
                <div class="flex flex-column gap-2">
                    <label for="email" class="font-medium">Email</label>
                    <input pInputText id="email" type="email" formControlName="email" placeholder="seu@email.com"
                        [class.ng-invalid]="email?.invalid && email?.touched" [class.ng-dirty]="email?.touched" />
                    <small *ngIf="email?.invalid && email?.touched" class="p-error">
                        <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
                        <span *ngIf="email?.errors?.['email']">Email inválido</span>
                    </small>
                </div>

                <div class="flex flex-column gap-2">
                    <label for="password" class="font-medium">Senha</label>
                    <p-password formControlName="password" [toggleMask]="true" [feedback]="false" placeholder="••••••••"
                        [inputStyleClass]="password?.invalid && password?.touched ? 'ng-invalid ng-dirty' : ''">
                    </p-password>
                    <small *ngIf="password?.invalid && password?.touched" class="p-error">
                        <span *ngIf="password?.errors?.['required']">Senha é obrigatória</span>
                        <span *ngIf="password?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
                    </small>
                </div>

                <p-button type="submit" label="{{ loading ? 'Entrando...' : 'Entrar' }}" icon="pi pi-sign-in"
                    [loading]="loading" [disabled]="loading" styleClass="w-full mt-2">
                </p-button>
            </form>
        </ng-template>

        <ng-template pTemplate="footer">
            <p-divider></p-divider>
            <p class="text-center text-color-secondary m-0">
                Não tem uma conta?
                <a routerLink="/auth/register" class="font-medium no-underline"
                    style="color: var(--primary-color);">Cadastre-se</a>
            </p>
        </ng-template>
    </p-card>
</div>
