<div class="register-container">
    <div class="register-card">
        <h2>Criar Conta</h2>
        <p class="subtitle">Preencha os dados para criar sua conta</p>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" formControlName="name" class="form-control"
                    [class.invalid]="name?.invalid && name?.touched" placeholder="João Silva">
                <div *ngIf="name?.invalid && name?.touched" class="error-message">
                    <span *ngIf="name?.errors?.['required']">Nome é obrigatório</span>
                    <span *ngIf="name?.errors?.['minlength']">Nome deve ter no mínimo 3 caracteres</span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" formControlName="email" class="form-control"
                    [class.invalid]="email?.invalid && email?.touched" placeholder="seu@email.com">
                <div *ngIf="email?.invalid && email?.touched" class="error-message">
                    <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
                    <span *ngIf="email?.errors?.['email']">Email inválido</span>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Telefone (opcional)</label>
                <input type="tel" id="phone" formControlName="phone" class="form-control" placeholder="(11) 98765-4321">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" formControlName="password" class="form-control"
                    [class.invalid]="password?.invalid && password?.touched" placeholder="••••••••">
                <div *ngIf="password?.invalid && password?.touched" class="error-message">
                    <span *ngIf="password?.errors?.['required']">Senha é obrigatória</span>
                    <span *ngIf="password?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control"
                    [class.invalid]="confirmPassword?.invalid && confirmPassword?.touched" placeholder="••••••••">
                <div *ngIf="confirmPassword?.invalid && confirmPassword?.touched" class="error-message">
                    <span *ngIf="confirmPassword?.errors?.['required']">Confirmação de senha é obrigatória</span>
                    <span *ngIf="confirmPassword?.errors?.['passwordMismatch']">As senhas não coincidem</span>
                </div>
            </div>

            <button type="submit" class="btn-primary" [disabled]="loading">
                {{ loading ? 'Criando conta...' : 'Criar Conta' }}
            </button>
        </form>

        <div class="footer">
            <p>Já tem uma conta? <a routerLink="/auth/login">Entrar</a></p>
        </div>
    </div>
</div>
