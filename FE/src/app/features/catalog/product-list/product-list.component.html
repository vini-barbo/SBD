<div class="product-list-container">
    <h1>Produtos</h1>

    <div *ngIf="loading" class="loading">Carregando...</div>

    <div *ngIf="!loading && products.length === 0" class="empty-state">
        <p>Nenhum produto encontrado</p>
    </div>

    <div *ngIf="!loading && products.length > 0" class="products-grid">
        <div *ngFor="let product of products" class="product-card">
            <div class="product-image">
                <img [src]="product.images[0]?.imageUrl || '/assets/placeholder.png'" [alt]="product.name">
            </div>
            <div class="product-info">
                <h3>{{ product.name }}</h3>
                <p class="product-description">{{ product.description }}</p>
                <div class="product-footer">
                    <span class="product-price">{{ product.basePrice | currency }}</span>
                    <a [routerLink]="['/catalog', product.id]" class="btn-view">Ver Detalhes</a>
                </div>
            </div>
        </div>
    </div>

    <app-pagination *ngIf="page && page.totalPages > 1" [currentPage]="page.number" [totalPages]="page.totalPages"
        (pageChange)="onPageChange($event)">
    </app-pagination>
</div>
