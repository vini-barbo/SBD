version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sbd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sbd_db}
      POSTGRES_USER: ${DB_USER:-sbd_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sbd_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sbd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sbd_user} -d ${DB_NAME:-sbd_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  sbd-network:
    driver: bridge
